version: 1

project:
  title: System Design
  description: A practical textbook for designing scalable, reliable distributed systems.
  keywords:
    - system design
    - distributed systems
    - networking
    - databases
    - caching
    - queues
    - streaming
  toc:
    - file: index.md
    - file: basics.md
      children:
        - file: basics/networking.md
        - file: basics/servers.md
    - file: database.md
      children:
        - file: database/postgresql.md
        - file: database/dynamodb.md
        - file: database/cassandra.md
        - file: database/elasticsearch.md
    - file: caching.md
      children:
        - file: caching/fundamentals.md
        - file: caching/redis.md
    - file: queues.md
      children:
        - file: queues/queue-fundamentals.md
        - file: queues/sqs.md
        - file: queues/rabbitmq.md
    - file: streaming.md
      children:
        - file: streaming/streaming-fundamentals.md
        - file: streaming/stream-processing-architectures.md
        - file: streaming/kafka.md
        - file: streaming/flink.md

site:
  template: book-theme
  title: System Design
  options:
    style: ./styles.css
